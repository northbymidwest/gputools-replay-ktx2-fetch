name: release
run-name: release ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Publishes gputools-replay-ktx2-fetch, then tags, through the shared composites
# in northbymidwest/gh-actions (see that repo's README for the design). The tag
# is an output of a succeeded release, never its trigger.
#
# It depends on gputools-replay-hl, released from its own repo FIRST: preflight
# checks that version is already on crates.io (registry-prereqs). hl is a plain
# registry dependency, so no sibling checkout is needed. Publishing runs on
# macOS because cargo publish's verify build links the private framework through
# hl, with --no-default-features so that build's floor is one the hosted macOS
# 26 image can link.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.1.0)'
        type: string
        required: true
      dry_run:
        description: 'Stop before publishing anything'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.pre.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pre
        uses: northbymidwest/gh-actions/release-preflight@19c984de66ed8a32ca544a06e16eb66d58f2a79d # v0.2.0
        with:
          version: ${{ inputs.version }}
          dry-run: ${{ inputs.dry_run }}
          crates: Cargo.toml
          packages: gputools-replay-ktx2-fetch
          registry-prereqs: gputools-replay-hl=Cargo.toml
          token: ${{ github.token }}
      - uses: northbymidwest/gh-actions/release-review-summary@19c984de66ed8a32ca544a06e16eb66d58f2a79d # v0.2.0
        with:
          version: ${{ inputs.version }}
          dry-run: ${{ inputs.dry_run }}
          tag: ${{ steps.pre.outputs.tag }}
          registry: ${{ steps.pre.outputs.registry }}
          what-approving-does: publishes gputools-replay-ktx2-fetch and tags v${{ inputs.version }}
          token: ${{ github.token }}

  publish:
    needs: preflight
    environment: release
    # macOS: cargo publish's verify build links the private framework through
    # gputools-replay-hl. --no-default-features keeps that build's floor at what
    # the hosted macOS 26 image can link.
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: northbymidwest/gh-actions/release-publish@19c984de66ed8a32ca544a06e16eb66d58f2a79d # v0.2.0
        with:
          packages: gputools-replay-ktx2-fetch
          publish: ${{ needs.preflight.outputs.publish }}
          args: --no-default-features
          dry-run: ${{ inputs.dry_run }}
      - uses: northbymidwest/gh-actions/release-tag@19c984de66ed8a32ca544a06e16eb66d58f2a79d # v0.2.0
        with:
          version: ${{ inputs.version }}
          deploy-key: ${{ secrets.RELEASE_TAG_KEY }}
          token: ${{ github.token }}
          dry-run: ${{ inputs.dry_run }}
