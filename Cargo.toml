[package]
name = "gputools-replay-ktx2-fetch"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
description = "Lossless KTX2 export of every texture in an Xcode .gputrace capture, via gputools-replay-hl"
license = "0BSD"
repository = "https://github.com/northbymidwest/gputools-replay-ktx2-fetch"
readme = "README.md"
keywords = ["macos", "metal", "gpu", "texture", "ktx2"]
categories = ["command-line-utilities", "rendering::data-formats"]
# What a `cargo install` needs: the code, its tests, the DFD fixtures the
# tests compare against, and the README/LICENSE. Repository tooling, the
# design docs, the fixture apps, and the capture scripts stay in git.
exclude = [
    "/.github/",
    "/.githooks/",
    "/captures/",
    "/docs/",
    "/fixtures/",
    "/scripts/",
    "/tools/",
    "/deny.toml",
    "/typos.toml",
    "/RELEASING.md",
]

[lib]
name = "gputools_replay_ktx2_fetch"
path = "src/lib.rs"

[[bin]]
name = "gputools-replay-ktx2-fetch"
path = "src/main.rs"

[dependencies]
gputools-replay-hl = { version = "0.1.1", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
# Require macOS 27 (forwarded to the engine). Disable with --no-default-features
# to also build on macOS 26, which is what hosted CI does.
default = ["macos27"]
macos27 = ["gputools-replay-hl/macos27"]
# Gates every test that drives the real replayer or needs a capture.
oracle = []

[build-dependencies]
toml = "1"
